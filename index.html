<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — Η σελίδα δεν βρέθηκε</title>
<style>
  :root{
    --bg:#0b0b0f;
    --fg:#f5f5f7;
    --muted:#8e8e96;
    --accent:#6366f1;
    --line:rgba(255,255,255,.10);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#fafafa;
      --fg:#111114;
      --muted:#6b6b72;
      --accent:#4f46e5;
      --line:rgba(0,0,0,.10);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    display:grid;
    place-items:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  main{
    text-align:center;
    max-width:520px;
    animation:rise .6s cubic-bezier(.16,1,.3,1) both;
  }
  .code{
    font-size:clamp(88px,22vw,180px);
    line-height:.9;
    font-weight:800;
    letter-spacing:-.05em;
    margin:0;
    background:linear-gradient(180deg,var(--fg),var(--muted));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  h1{
    font-size:clamp(18px,4vw,24px);
    font-weight:600;
    margin:20px 0 8px;
    letter-spacing:-.01em;
  }
  p{
    margin:0 auto 32px;
    color:var(--muted);
    font-size:16px;
    line-height:1.6;
    max-width:40ch;
  }
  a.btn{
    display:inline-block;
    padding:12px 24px;
    border-radius:999px;
    border:1px solid var(--line);
    color:var(--fg);
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    transition:background .2s ease,border-color .2s ease,transform .2s ease;
  }
  a.btn:hover{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    transform:translateY(-1px);
  }
  a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  footer{
    margin-top:40px;
    font-size:13px;
    color:var(--muted);
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){main{animation:none}}
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Η σελίδα δεν βρέθηκε</h1>
    <p>Η διεύθυνση που ζητήσατε δεν υπάρχει ή έχει μετακινηθεί.</p>
    <a class="btn" href="/">Αρχική σελίδα</a>
    <footer>Error 404 — Not Found</footer>
  </main>
</body>
</html>
